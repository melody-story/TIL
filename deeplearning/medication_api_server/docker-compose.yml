services:
  medication-api:
    build: .
    image: medication-api:latest
    container_name: medication-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"   # 외부 노출은 nginx가 담당 → 로컬호스트만 바인딩
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
